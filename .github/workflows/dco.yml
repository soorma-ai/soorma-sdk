# SPDX-License-Identifier: Apache-2.0
#
# DCO (U1 NFR-U1-29 to -31). Every non-merge commit in a pull request carries a
# Signed-off-by matching its author, except a commit GitHub's commit API
# reports as authored by dependabot[bot] AND verified (Dependabot cannot sign
# off; GitHub signs its commits, so an email cannot be spoofed into the
# exemption). A failed lookup fails the check. The logic is tools/dco, tested
# apart from this workflow. The token is actions/github-script's own default
# github-token input, never an environment variable; permissions are read-only.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: Check sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out, with history for the range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit carries a matching sign-off
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: run } = await import('${{ github.workspace }}/tools/dco/action.ts');
            await run({ github, context, core });
