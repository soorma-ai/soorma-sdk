# SPDX-License-Identifier: Apache-2.0
#
# soorma-sdk CI (U1 NFR-U1-24 to -28). Every action is pinned by commit SHA with
# its release tag in a comment; runners are ubuntu-24.04; permissions are
# read-only. Runs on pull requests and on pushes to dev; main is reached only
# through pull requests, whose run tested the merge result.
name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, lint, format, tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Audit dependencies (moderate and above fail)
        run: pnpm audit --audit-level moderate

      - name: Audit exceptions are still needed (they expire by themselves)
        run: pnpm check:audit-exceptions

  checks:
    name: Repository checks (contract drift, SPDX, workflows, generated types, names, packaging)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The names check reads the TypeScript driver's names and surface from
      # the built package's declarations (typescript/dist/index.d.ts).
      - name: Build the TypeScript package (for the names check)
        run: pnpm --filter @soorma/sdk build

      # The remote half of the drift check reads soorma-core with git only:
      # no token, no REST API. It never runs with --offline here.
      - name: Repository checks
        run: pnpm checks

  conformance-self-test:
    name: Conformance self-test (reference driver; four negative controls)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Green only when the reference driver passes its declared cases and every
      # faulted run fails exactly its declared set (business-logic-model §5.2).
      # The run directory (CAs, case secrets) is never uploaded.
      - name: Conformance self-test
        run: pnpm conformance:self-test

  # The TypeScript package through every conformance case (NFR-U3-23): Node 24
  # and 26 with @opentelemetry/api 1.10.0 as locked, and Node 24 at the peer
  # range's floor, 1.9.0 (NFR-U3-16), swapped in from the lock after the frozen
  # install. The workspace's tools run on .node-version; the driver, and so the
  # SDK, on the matrix's Node. The second local user lets CC-SEC-05 run (P-10);
  # --local-skip is refused in CI. The run directory is never uploaded.
  conformance-typescript:
    name: Conformance, TypeScript (Node ${{ matrix.node }}, @opentelemetry/api ${{ matrix.otel-api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24.22.3
            otel-api: 1.10.0
          - node: 26.13.0
            otel-api: 1.10.0
          - node: 24.22.3
            otel-api: 1.9.0
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up the driver's Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Keep the driver's Node path
        id: driver-node
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Use @opentelemetry/api 1.9.0, the peer range's floor (from the lock)
        if: matrix.otel-api == '1.9.0'
        run: node tools/otel-api-floor/use-floor.ts

      - name: Build @soorma/sdk
        run: pnpm --filter @soorma/sdk build

      - name: Create the second local user (P-10)
        run: sudo useradd --no-create-home --shell /usr/sbin/nologin soorma-foreign

      - name: Conformance, every case
        env:
          DRIVER_NODE: ${{ steps.driver-node.outputs.path }}
        run: |
          "$DRIVER_NODE" --version
          pnpm conformance run --driver "$DRIVER_NODE --expose-gc typescript/conformance-driver/driver.ts" --foreign-user soorma-foreign

  # The end-to-end stack (U2): soorma-core at the contract tag, fresh per job.
  # Skipped only when every changed file is under aidlc-docs/ (soorma-core's
  # pattern): a push compares with the commit before it, a pull request its
  # base with GitHub's test merge commit; commit SHAs only, through env; a diff
  # that cannot be computed runs the job. Never on a push to main: the pull
  # request's run already tested the merge result.
  changes:
    name: Changed files (does the end-to-end job run?)
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - name: Check out, with history for the diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether the end-to-end job runs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi
          e2e=true
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
            && files=$(git diff --name-only --no-renames "$base" "$HEAD_SHA" --); then
            echo "Changed files, $base..$HEAD_SHA:"
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^aidlc-docs/'; then
              e2e=false
            fi
          else
            echo "The diff could not be computed: the end-to-end job runs."
          fi
          echo "e2e=$e2e" | tee -a "$GITHUB_OUTPUT"

  # core-up, setup, prove-stack, then core-down whatever happened. core-down
  # always searches soorma-core's logs for credentials and secrets, so a leak
  # fails a green job too; it prints the logs only when the job failed or was
  # cancelled (a job stopped by its timeout is cancelled). No cache, no
  # artifact, no secret: .e2e/ never leaves the runner.
  e2e:
    name: End-to-end stack (soorma-core at the contract tag)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node 26.13.0 for soorma-core's own steps
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Keep soorma-core's Node path for core-up --core-node
        id: core-node
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: core-up
        env:
          CORE_NODE: ${{ steps.core-node.outputs.path }}
        run: pnpm e2e:core-up --core-node "$CORE_NODE"

      - name: setup
        run: pnpm e2e:setup --agents agent-a,agent-b

      - name: prove-stack
        run: pnpm e2e:prove-stack

      - name: core-down (searches the logs every run; prints them if the job failed or was cancelled)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            pnpm e2e:core-down
          else
            pnpm e2e:core-down --logs
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
