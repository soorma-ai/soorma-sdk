# SPDX-License-Identifier: Apache-2.0
#
# soorma-sdk CI (U1 NFR-U1-24 to -28). Every action is pinned by commit SHA with
# its release tag in a comment; runners are ubuntu-24.04; permissions are
# read-only. Runs on pull requests and on pushes to dev; main is reached only
# through pull requests, whose run tested the merge result.
name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, lint, format, tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Audit dependencies (moderate and above fail)
        run: pnpm audit --audit-level moderate

      - name: Audit exceptions are still needed (they expire by themselves)
        run: pnpm check:audit-exceptions

  checks:
    name: Repository checks (contract drift, SPDX, workflows, generated types, names, packaging)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The remote half of the drift check reads soorma-core with git only:
      # no token, no REST API. It never runs with --offline here.
      - name: Repository checks
        run: pnpm checks

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
