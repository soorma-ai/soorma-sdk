# SPDX-License-Identifier: Apache-2.0
#
# pnpm settings for the soorma-sdk workspace (U1 NFR-U1-24 to -26), mirroring
# soorma-core's. The language-neutral tooling (the conformance machinery and the
# repository checks) is private and never published; typescript/ joins at U3;
# python/ stays outside.
packages:
  - 'conformance/*'
  - 'tools'

# pnpm's own refusal of a mismatched pnpm version is off: with it on, pnpm 12
# writes pnpm-lock.yaml as two YAML documents, and GitHub's dependency graph
# reads only the first, so Dependabot and dependency review would see no
# dependencies. CI installs exactly the packageManager version (as soorma-core).
pmOnFail: ignore

# Release cooldown: 7 days, in minutes.
minimumReleaseAge: 10080

# Exact versions only.
saveExact: true

# Refuse a Node version outside engines.node.
engineStrict: true

# No dependency lifecycle scripts. An install fails if a dependency has a build
# script that is not listed here; adding one is recorded in DEPENDENCIES.md.
strictDepBuilds: true
allowBuilds: {}

# Overrides: each forces a version outside a dependent's declared range, and is
# recorded under "Overrides" in DEPENDENCIES.md.
# minimatch: GHSA-g3hv-75wg-m249 (moderate, denial of service), fixed only in
# 11.0.1+, while eslint 10.14.0 and typescript-estree 8.72.1 still declare ^10.
overrides:
  minimatch@>=7 <11.0.1: 11.0.3

# Audit exceptions: by advisory id only, never by package or severity. Each is
# recorded under "Audit exceptions" in DEPENDENCIES.md and in
# tools/audit-exceptions/register.json, and expires by itself: the
# audit-exceptions check fails once a fix is published or the affected package
# is no longer installed.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
